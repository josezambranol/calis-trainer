name: Release & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/calishome-api
  FRONTEND_IMAGE: ${{ github.repository }}/calishome-web

jobs:
  build-and-push:
    name: Build & Push Containers (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract image metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Staging Deploy Webhook (si esta configurado)
        env:
          STAGING_DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "${STAGING_DEPLOY_WEBHOOK}" ]; then
            curl --fail --show-error --silent -X POST "${STAGING_DEPLOY_WEBHOOK}"
          else
            echo "STAGING_DEPLOY_WEBHOOK no configurado (entorno portfolio $0): imagenes publicadas en ghcr.io listos para pull."
          fi

      - name: Smoke Check Staging URL (si STAGING_URL esta definida)
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -n "${STAGING_URL}" ]; then
            curl --fail --show-error --silent "${STAGING_URL}/api/v1/health"
          else
            echo "STAGING_URL no definida; omitiendo smoke HTTP remoto."
          fi

  deploy-production:
    name: Deploy to Production (Aprobacion Manual)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger Production Deploy Webhook (si esta configurado)
        env:
          PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "${PRODUCTION_DEPLOY_WEBHOOK}" ]; then
            curl --fail --show-error --silent -X POST "${PRODUCTION_DEPLOY_WEBHOOK}"
          else
            echo "PRODUCTION_DEPLOY_WEBHOOK no configurado; aprobacion registrada en GitHub Environment 'production'."
          fi

      - name: Smoke Check Production URL (si PRODUCTION_URL esta definida)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -n "${PRODUCTION_URL}" ]; then
            curl --fail --show-error --silent "${PRODUCTION_URL}/api/v1/health"
          else
            echo "PRODUCTION_URL no definida; omitiendo smoke HTTP remoto."
          fi
