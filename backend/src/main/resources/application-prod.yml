spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
    refresh:
      cookie-secure: true
      cookie-same-site: ${COOKIE_SAME_SITE:Lax}

logging:
  level:
    root: INFO
    com.calishome.api: INFO
