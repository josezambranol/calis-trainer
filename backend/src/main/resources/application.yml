spring:
  application:
    name: calishome-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:calishome-api}
      access-token-ttl-minutes: 15
    refresh:
      ttl-days: 30
      cookie-name: calishome_refresh
      cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    lockout:
      max-attempts: 5
      duration-minutes: 15
    rate-limit:
      enabled: true
      requests-per-minute: 10
  mail:
    from: ${MAIL_FROM:no-reply@calishome.app}
  push:
    enabled: ${PUSH_ENABLED:true}
    scheduler-enabled: ${PUSH_SCHEDULER_ENABLED:true}
    subject: ${VAPID_SUBJECT:mailto:soporte@calishome.app}
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    global-rate-limit:
      enabled: ${GLOBAL_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${GLOBAL_RATE_LIMIT_RPM:120}
  billing:
    provider: ${BILLING_PROVIDER:wompi}
    checkout-base-url: https://checkout.wompi.co/p/
    public-key: ${WOMPI_PUBLIC_KEY:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    events-secret: ${WOMPI_EVENTS_SECRET:}
    currency: COP
    pro-monthly-cents: 1990000
    pro-yearly-cents: 15900000
    grace-period-days: 5
    sandbox-enabled: ${BILLING_SANDBOX_ENABLED:true}
