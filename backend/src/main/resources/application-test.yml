spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

app:
  auth:
    jwt:
      secret: test-only-calishome-secret-key-at-least-32-bytes-long-2026
    refresh:
      cookie-secure: false
    google:
      client-id: test-google-client-id.apps.googleusercontent.com
    rate-limit:
      enabled: false
  push:
    scheduler-enabled: false

logging:
  level:
    com.calishome.api: INFO
