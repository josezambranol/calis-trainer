spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

app:
  auth:
    jwt:
      secret: test-only-calishome-secret-key-at-least-32-bytes-long-2026
    refresh:
      cookie-secure: false
    google:
      client-id: test-google-client-id.apps.googleusercontent.com
    rate-limit:
      enabled: false
  push:
    scheduler-enabled: false
  security:
    trust-forwarded-headers: false
    cors:
      allowed-origins: http://localhost:5173
    global-rate-limit:
      enabled: false
      requests-per-minute: 120
  billing:
    events-secret: test-wompi-events-secret-2026
    sandbox-enabled: true

logging:
  level:
    com.calishome.api: INFO
