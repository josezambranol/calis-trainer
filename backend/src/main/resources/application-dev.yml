spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calishome}
    username: ${DB_USERNAME:calishome}
    password: ${DB_PASSWORD:calishome_dev}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    jwt:
      # Solo para desarrollo local; en prod debe venir por variable de entorno
      secret: ${JWT_SECRET:dev-only-calishome-secret-key-at-least-32-bytes-long-2026}
    refresh:
      cookie-secure: false

logging:
  level:
    com.calishome.api: DEBUG
    org.flywaydb: INFO
