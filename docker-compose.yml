services:
  postgres:
    image: postgres:16-alpine
    container_name: calishome-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calishome}
      POSTGRES_USER: ${POSTGRES_USER:-calishome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calishome_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - calishome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calishome} -d ${POSTGRES_DB:-calishome}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calishome-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-calishome}
      DB_USERNAME: ${POSTGRES_USER:-calishome}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-calishome_dev}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-calishome-secret-key-at-least-32-bytes-long-2026}
      JWT_ISSUER: ${JWT_ISSUER:-calishome-api}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@calishome.app}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calishome-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: calishome-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
    restart: unless-stopped

volumes:
  calishome_pgdata:
